[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrkr"
version = "0.2.0"
description = "CLI tool for extracting cell type marker genes from manuscripts and data tables"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mrkr developers"}
]
keywords = ["bioinformatics", "cell-types", "marker-genes", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pandas>=2.1.0",
    "openpyxl>=3.0.0",
    "pillow>=10.0.0",
    "litellm>=1.0.0",
]

[project.scripts]
mrkr = "mrkr.cli:cli"
