[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrkr"
version = "0.4.0"
description = "Extract source-grounded cell type marker claims from scientific manuscripts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mrkr developers"}
]
keywords = ["bioinformatics", "cell-types", "marker-genes", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "json-repair>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
mrkr = "mrkr.cli:cli"
